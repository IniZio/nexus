id = "nexus3"
name = "nexus3"
version = "0.1.1"
min_herdr_version = "0.7.4"
description = "Attach to nexus3 microVM workspaces, list them, and create them without leaving Herdr."
# Only Linux/x86_64 has a pre-built binary.  build.sh exits non-zero on other
# platforms with a "build from source" message.
platforms = ["linux"]

[[build]]
command = ["sh", "build.sh"]

[[panes]]
id = "attach"
title = "nexus3 attach"
placement = "tab"
command = ["sh", "bin/pane.sh", "attach"]

[[panes]]
id = "shell"
title = "nexus3 guest shell"
placement = "tab"
command = ["sh", "bin/pane.sh", "shell"]

[[panes]]
id = "workspaces"
title = "nexus3 workspaces"
placement = "overlay"
command = ["sh", "bin/pane.sh", "workspaces"]

[[panes]]
id = "create"
title = "nexus3 create"
placement = "tab"
command = ["sh", "bin/pane.sh", "create"]

[[panes]]
id = "create-space"
title = "nexus3 create sandbox space"
placement = "tab"
command = ["sh", "bin/pane.sh", "create-space"]

[[panes]]
id = "logs"
title = "nexus3 logs"
placement = "split"
command = ["sh", "bin/pane.sh", "logs"]

[[panes]]
id = "doctor"
title = "nexus3 doctor"
placement = "split"
command = ["sh", "bin/pane.sh", "doctor"]

[[panes]]
id = "launch"
title = "nexus3 launch"
placement = "tab"
command = ["sh", "bin/pane.sh", "launch"]

[[panes]]
id = "space-agent"
title = "nexus3 launch agent in sandbox"
placement = "tab"
command = ["sh", "bin/pane.sh", "space-agent"]

# worktree-sandbox — provisioning runs INSIDE this pane, not in the action that
# opens it.  Building a worktree sandbox pulls an image, lays down an ext4 disk,
# and boots a VM; on a cold cache that is minutes during which the operator's
# new worktree workspace previously showed nothing but a host-path shell, with
# no signal that anything was happening at all.
#
# Opening the pane FIRST and running the build in it means the operator watches
# it happen, and — because pane.sh blocks on Enter for a non-zero exit — a
# failure STAYS ON SCREEN instead of going only to `herdr plugin log list`,
# which is nowhere anyone looks.  There is a real instance of that in the log:
# exit 1, workspace_not_found, "worktree-sandbox: open guest pane: space-create:
# open shell pane: exit status 1", with the VM already built and running.
[[panes]]
id = "worktree-sandbox"
title = "nexus3 sandbox this worktree"
placement = "tab"
command = ["sh", "bin/pane.sh", "worktree-sandbox"]

[[actions]]
id = "workspaces"
title = "nexus3: list sandboxes"
contexts = ["workspace"]
command = ["sh", "bin/open-pane.sh", "workspaces", "overlay"]

[[actions]]
id = "create"
title = "nexus3: create a sandbox"
contexts = ["workspace"]
command = ["sh", "bin/open-pane.sh", "create", "tab"]

[[actions]]
id = "attach"
title = "nexus3: attach to a workspace"
contexts = ["workspace"]
command = ["sh", "bin/open-pane.sh", "attach", "tab"]

[[actions]]
id = "create-space"
title = "nexus3: create sandbox space (from local Containerfile)"
contexts = ["workspace"]
command = ["sh", "bin/open-pane.sh", "create-space", "tab"]

[[actions]]
id = "logs"
title = "nexus3: workspace logs"
contexts = ["workspace"]
command = ["sh", "bin/open-pane.sh", "logs", "split"]

[[actions]]
id = "doctor"
title = "nexus3: doctor"
contexts = ["workspace"]
command = ["sh", "bin/open-pane.sh", "doctor", "split"]

[[actions]]
id = "open-guest-pane"
title = "nexus3: open guest pane"
contexts = ["workspace"]
command = ["sh", "bin/open-pane.sh", "space-open-pane"]

[[actions]]
id = "new-tab"
title = "nexus3: new tab (guest pane in nexus3 spaces, host tab elsewhere)"
contexts = ["workspace"]
command = ["sh", "bin/open-pane.sh", "new-tab"]

[[actions]]
id = "space-pause"
title = "nexus3: pause this sandbox"
contexts = ["workspace"]
command = ["sh", "bin/open-pane.sh", "space-pause"]

[[actions]]
id = "space-resume"
title = "nexus3: resume this sandbox"
contexts = ["workspace"]
command = ["sh", "bin/open-pane.sh", "space-resume"]

[[actions]]
id = "space-remove"
title = "nexus3: remove this sandbox and close the space"
contexts = ["workspace"]
command = ["sh", "bin/open-pane.sh", "space-remove"]

[[actions]]
id = "space-agent"
title = "nexus3: launch Claude agent in sandbox"
contexts = ["workspace"]
command = ["sh", "bin/open-pane.sh", "space-agent", "tab"]

[[actions]]
id = "worktree-sandbox"
title = "nexus3: sandbox this worktree"
contexts = ["workspace"]
command = ["sh", "bin/open-pane.sh", "worktree-sandbox"]

# worktree.removed — tear down the sandbox that was bound to the removed worktree.
# Resolved through the existing binding store via `nexus3 herdr prune --apply`.
# A sandbox with no binding row is NOT collectible here (see ticket 18 AC-18h);
# space-prune remains the required backstop for git-worktree-remove paths that
# bypass herdr (OQ-1: worktree.removed fires ONLY when herdr drives the removal).
[[events]]
on = "worktree.removed"
command = ["sh", "bin/on-worktree-removed.sh"]

# worktree.created — auto-provision a sandbox for the new worktree workspace.
# The --auto flag in herdrWorktreeSandbox applies the conditional rule: sandbox
# is created only when the source (parent) workspace is already nexus3-bound.
[[events]]
on = "worktree.created"
command = ["sh", "bin/on-worktree-created.sh"]
