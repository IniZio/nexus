version: v2
plugins:
  - local: protoc-gen-go
    out: computedriverpb
    opt:
      - paths=source_relative
      - Mcompute_driver.proto=github.com/IniZio/nexus/internal/openshell/computedriverpb
      - Moptions.proto=github.com/IniZio/nexus/internal/openshell/computedriverpb
      - Msandbox.proto=github.com/IniZio/nexus/internal/openshell/computedriverpb
      - Mdatamodel.proto=github.com/IniZio/nexus/internal/openshell/computedriverpb
  - local: protoc-gen-go-grpc
    out: computedriverpb
    opt:
      - paths=source_relative
      - Mcompute_driver.proto=github.com/IniZio/nexus/internal/openshell/computedriverpb
      - Moptions.proto=github.com/IniZio/nexus/internal/openshell/computedriverpb
      - Msandbox.proto=github.com/IniZio/nexus/internal/openshell/computedriverpb
      - Mdatamodel.proto=github.com/IniZio/nexus/internal/openshell/computedriverpb
