syntax = "proto3";

package openshell.options.v1;

option go_package = "github.com/IniZio/nexus/internal/openshell/computedriverpb";

import "google/protobuf/descriptor.proto";

message AuthorizationRule {
  string auth_mode = 1;
  string workspace_role = 2;
  string global_role = 3;
  string scope = 4;
}

extend google.protobuf.MethodOptions {
  AuthorizationRule authorization = 50000;
}

extend google.protobuf.FieldOptions {
  bool secret = 50001;
}
