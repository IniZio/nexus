syntax = "proto3";

package openshell.sandbox.v1;

option go_package = "github.com/IniZio/nexus/internal/openshell/computedriverpb";

import "google/protobuf/struct.proto";
import "google/protobuf/duration.proto";
import "datamodel.proto";

message SandboxPolicy {
  uint32 version = 1;
  FilesystemPolicy filesystem = 2;
  LandlockPolicy landlock = 3;
  ProcessPolicy process = 4;
  map<string, NetworkPolicyRule> network_policies = 5;
  map<string, NetworkMiddlewareConfig> network_middlewares = 6;
}

message FilesystemPolicy {
  bool include_workdir = 1;
  repeated string read_only = 2;
  repeated string read_write = 3;
}

message LandlockPolicy {
  string compatibility = 1;
}

message ProcessPolicy {
  string run_as_user = 1;
  string run_as_group = 2;
}

message NetworkPolicyRule {
  string name = 1;
  repeated NetworkEndpoint endpoints = 2;
  repeated NetworkBinary binaries = 3;
}

message NetworkMiddlewareConfig {
  string name = 1;
  string middleware = 2;
  google.protobuf.Struct config = 3;
  string on_error = 4;
  MiddlewareEndpointSelector endpoints = 5;
  int32 order = 6;
}

message MiddlewareEndpointSelector {
  repeated string include = 1;
  repeated string exclude = 2;
}

message NetworkCredentialBinding {
  string provider = 1;
}

enum NetworkTlsMode {
  NETWORK_TLS_MODE_UNSPECIFIED = 0;
  NETWORK_TLS_MODE_SKIP = 1;
  NETWORK_TLS_MODE_TERMINATE = 2 [deprecated = true];
  NETWORK_TLS_MODE_PASSTHROUGH = 3 [deprecated = true];
}

enum NetworkEnforcementMode {
  NETWORK_ENFORCEMENT_MODE_UNSPECIFIED = 0;
  NETWORK_ENFORCEMENT_MODE_ENFORCE = 1;
  NETWORK_ENFORCEMENT_MODE_AUDIT = 2;
}

enum NetworkAccessPreset {
  NETWORK_ACCESS_PRESET_UNSPECIFIED = 0;
  NETWORK_ACCESS_PRESET_READ_ONLY = 1;
  NETWORK_ACCESS_PRESET_READ_WRITE = 2;
  NETWORK_ACCESS_PRESET_FULL = 3;
}

message NetworkEndpoint {
  string host = 1;
  uint32 port = 2;
  string protocol = 3;
  NetworkTlsMode tls = 4;
  NetworkEnforcementMode enforcement = 5;
  NetworkAccessPreset access = 6;
  repeated L7Rule rules = 7;
  repeated string allowed_ips = 8;
  repeated uint32 ports = 9;
  repeated L7DenyRule deny_rules = 10;
  bool allow_encoded_slash = 11;
  string persisted_queries = 12;
  map<string, GraphqlOperation> graphql_persisted_queries = 13;
  uint32 graphql_max_body_bytes = 14;
  string path = 15;
  bool websocket_credential_rewrite = 16;
  bool request_body_credential_rewrite = 17;
  bool advisor_proposed = 18;
  string credential_signing = 19;
  string signing_service = 20;
  string signing_region = 21;
  uint32 json_rpc_max_body_bytes = 22;
  McpOptions mcp = 23;
  NetworkCredentialBinding credential_binding = 24;
  bool allow_uninspected_credentials = 25;
  bool provider_credentialed = 26;
}

message McpOptions {
  optional bool strict_tool_names = 1;
  optional bool allow_all_known_mcp_methods = 2;
  repeated string versions = 3;
}

message GraphqlOperation {
  string operation_type = 1;
  string operation_name = 2;
  repeated string fields = 3;
}

message L7DenyRule {
  string method = 1;
  string path = 2;
  string command = 3;
  map<string, L7QueryMatcher> query = 4;
  string operation_type = 5;
  string operation_name = 6;
  repeated string fields = 7;
  reserved 8;
  map<string, L7QueryMatcher> params = 9;
}

message L7Rule {
  L7Allow allow = 1;
}

message L7Allow {
  string method = 1;
  string path = 2;
  string command = 3;
  map<string, L7QueryMatcher> query = 4;
  string operation_type = 5;
  string operation_name = 6;
  repeated string fields = 7;
  reserved 8;
  map<string, L7QueryMatcher> params = 9;
}

message L7QueryMatcher {
  string glob = 1;
  repeated string any = 2;
}

message NetworkBinary {
  string path = 1;
  reserved 2;
  reserved "harness";
}

message GetSandboxConfigRequest {
  openshell.datamodel.v1.WorkspaceSelector workspace_scope = 3;
  string name = 1;
}

message GetGatewayConfigRequest {}

message GetGatewayConfigResponse {
  map<string, SettingValue> settings = 1;
  uint64 settings_revision = 2;
}

enum SettingScope {
  SETTING_SCOPE_UNSPECIFIED = 0;
  SETTING_SCOPE_SANDBOX = 1;
  SETTING_SCOPE_GLOBAL = 2;
}

message SettingValue {
  oneof value {
    string string_value = 1;
    bool bool_value = 2;
    int64 int_value = 3;
    bytes bytes_value = 4;
  }
}

message EffectiveSetting {
  SettingValue value = 1;
  SettingScope scope = 2;
}

enum PolicySource {
  POLICY_SOURCE_UNSPECIFIED = 0;
  POLICY_SOURCE_SANDBOX = 1;
  POLICY_SOURCE_GLOBAL = 2;
}

message GetSandboxConfigResponse {
  SandboxPolicy policy = 1;
  uint32 version = 2;
  string policy_hash = 3;
  map<string, EffectiveSetting> settings = 4;
  uint64 config_revision = 5;
  PolicySource policy_source = 6;
  uint32 global_policy_version = 7;
  uint64 provider_env_revision = 8;
  repeated SupervisorMiddlewareService supervisor_middleware_services = 9;
  string workspace = 10;
  string policy_validation_failure_mode = 11;
  bool extension_authentication_enabled = 12;
  string provider_attachment_epoch = 14;
  bool configuration_admitted = 13;
  string configuration_error = 16;
  string configuration_instance_id = 15;
}

message SupervisorMiddlewareService {
  reserved 4;
  reserved "timeout";
  string name = 1;
  string grpc_endpoint = 2;
  uint64 max_payload_bytes = 3;
  google.protobuf.Duration request_timeout = 104;
  bytes tls_ca_cert_pem = 5;
  string audience = 6;
  bool allow_insecure_transport = 7;
}
