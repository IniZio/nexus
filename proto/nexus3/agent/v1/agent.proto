syntax = "proto3";

package nexus3.agent.v1;

option go_package = "github.com/IniZio/nexus3/internal/core/agent/agentpb;agentpb";

// ─────────────────────────────────────────────────────────────────────────────
// Shared types
// ─────────────────────────────────────────────────────────────────────────────

// WinSize describes terminal dimensions.
// Carried as the initial PTY size inside ExecRequest.PtyOptions.
// Live resize events travel on the data-plane framed connection (clawk
// winsize frames), not via a control-plane RPC.
message WinSize {
  uint32 rows    = 1;
  uint32 cols    = 2;
  uint32 x_pixels = 3;
  uint32 y_pixels = 4;
}

// PtyOptions requests a PTY for an Exec call.
message PtyOptions {
  // TERM environment variable to advertise inside the PTY (e.g. "xterm-256color").
  string term = 1;
  // Initial terminal window size.
  WinSize initial_size = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// Exec — start a process
// ─────────────────────────────────────────────────────────────────────────────

// ExecRequest starts a process in the guest.
//
// session_id is *host-minted* (ticket 16): the host generates and supplies it
// so that session keying is host-authoritative in the host-dials-guest model.
// Interactive stdio (stdin, stdout, stderr) flows on the data-plane framed
// connection demuxed by session_id — never through this gRPC service.
message ExecRequest {
  // Host-minted session identifier; must be unique per sandbox lifetime.
  string session_id = 1;
  // Command to execute (argv[0] is the binary, subsequent elements are args).
  repeated string argv = 2;
  // Additional environment variables to merge into the process environment.
  map<string, string> env = 3;
  // Working directory inside the guest (defaults to / when empty).
  string cwd = 4;
  // If set, the agent allocates a PTY for the process.
  PtyOptions pty = 5;
}

// ExecResponse is returned once the process has been started.
message ExecResponse {
  // Guest-side PID of the newly started process.
  int32 pid = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// Signal — deliver a POSIX signal
// ─────────────────────────────────────────────────────────────────────────────

message SignalRequest {
  // Session whose process should receive the signal.
  string session_id = 1;
  // POSIX signal number (e.g. 2 = SIGINT, 9 = SIGKILL, 15 = SIGTERM).
  int32 signum = 2;
}

message SignalResponse {}

// ─────────────────────────────────────────────────────────────────────────────
// Session status — read-only probes
// ─────────────────────────────────────────────────────────────────────────────

// SessionState is the lifecycle state of a session as seen by the agent.
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_RUNNING     = 1;
  SESSION_STATE_EXITED      = 2;
}

// SessionInfo carries read-only status for one session.
// It is NOT used as the reattach discriminant — reattach is the data-connection
// handshake, not a control-plane RPC (ticket 36).
message SessionInfo {
  string session_id = 1;
  SessionState state = 2;
  // Guest-side PID (0 when state is EXITED and PID has been reaped).
  int32 pid = 3;
  // Exit code of the process; meaningful only when state == SESSION_STATE_EXITED.
  int32 exit_code = 4;
}

message SessionStatusRequest {
  string session_id = 1;
}

message SessionStatusResponse {
  SessionInfo info = 1;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// Copy — file-transfer negotiation (split-plane, ticket 22)
// ─────────────────────────────────────────────────────────────────────────────

// CopyDirection controls the transfer direction.
enum CopyDirection {
  COPY_DIRECTION_UNSPECIFIED = 0;
  // PUSH: host → guest (operator-initiated write into the sandbox).
  COPY_DIRECTION_PUSH        = 1;
  // PULL: guest → host (extracting files from the sandbox).
  COPY_DIRECTION_PULL        = 2;
}

// CopyRequest negotiates a file-transfer operation.
//
// This is a *control-plane* RPC only — it carries metadata and returns a
// transfer handle.  The actual bytes flow on the data-plane side-channel
// (separate vsock connection identified by transfer_id).
// The agent archives directories itself; the caller must not run guest tar.
message CopyRequest {
  // Direction of the transfer.
  CopyDirection direction = 1;
  // Absolute path inside the guest.
  string guest_path = 2;
  // When true the agent archives the directory tree before transfer.
  bool is_directory = 3;
  // Expected byte count of the raw payload (non-directory PUSH only).
  // Declared as optional (proto3 field presence) so nil/absent is
  // distinguishable from the value 0 (a legitimately empty file). The guest
  // fails closed when the field is absent — the host must always set this for
  // single-file PUSH. A pointer to 0 is valid and means an empty file.
  // Not set for directory PUSH transfers.
  optional int64 expected_bytes = 4;
}

// CopyResponse carries the transfer handle the caller uses to open the
// data-plane side-channel for the actual byte transfer.
message CopyResponse {
  // Opaque token identifying the data-plane transfer slot.
  string transfer_id = 1;
  // Authoritative byte count of the payload for single-file PULL transfers.
  // The receiving host rejects the transfer if the received byte count does not
  // match — a fail-closed guard against transport truncation (e.g. the 32 MiB
  // vsock cap observed in in-guest buildkit exports).
  //
  // Declared as optional (proto3 field presence) so nil/absent is
  // distinguishable from the value 0 (a legitimately empty file). For
  // single-file PULL the host fails closed when the field is absent — the
  // agent must always stat and set this field. Not set for directory PULL or
  // any PUSH transfer.
  optional int64 declared_bytes = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// AgentInfo — version query
// ─────────────────────────────────────────────────────────────────────────────

message AgentInfoRequest {}

// AgentInfoResponse carries the agent's build tag (the ldflags-stamped
// value of agentBuildTag in cmd/nexus3-agent/main.go).
message AgentInfoResponse {
  // build_tag is the value stamped by -ldflags "-X main.agentBuildTag=…"
  // at image-build time.  "dev" means the binary was built without stamping.
  string build_tag = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// RestartAgent — hot-swap the in-guest binary (PID-1 self-exec)
// ─────────────────────────────────────────────────────────────────────────────

// RestartAgentRequest initiates an in-place binary swap.
//
// The host must have already pushed the replacement binary to staged_path
// (via the Copy RPC with ExpectedBytes set) before calling RestartAgent.
// The guest verifies the on-disk size of staged_path against expected_bytes,
// renames it atomically over /sbin/nexus3-agent, then calls syscall.Exec to
// replace PID 1's process image with the new binary.
//
// The vsock listeners (control port 1024 and data port 1025) are created with
// SOCK_CLOEXEC by mdlayher/vsock, so the kernel closes them automatically
// during execve.  The replacement image re-listens on the same ports
// immediately after exec.  There is a brief unbound window (typically tens of
// ms) between the old image's exec and the new image's vsock.Listen; the host
// absorbs this via Ping polling until the new agent answers.  An in-flight
// exec command does NOT survive a swap: accepted connections carry SOCK_CLOEXEC
// and are closed by execve along with the listeners.
// The host-side connection to this RPC will be reset (the old gRPC server
// dies); the host must treat the reset as "restart initiated" and poll Ping
// until the new agent answers, then call AgentInfo to confirm the version.
//
// Running exec sessions (PTYs, pipes) are NOT preserved: they die with the
// old process image. Callers must check ListSessions first and pass
// force=true to override if active sessions exist.
message RestartAgentRequest {
  // Absolute path inside the guest of the staged replacement binary.
  // Must have been written by a prior Copy PUSH with ExpectedBytes set.
  string staged_path = 1;
  // Expected byte count of staged_path. Fail-closed: the guest rejects the
  // request if the on-disk size does not match.
  int64 expected_bytes = 2;
  // If false (default) the guest rejects the request when active sessions
  // exist.  Set true to force the swap even with live exec sessions; those
  // sessions will be killed by the exec.
  bool force = 3;
}

// RestartAgentResponse is returned only if the guest detects a pre-exec
// error (size mismatch, active sessions without force, rename failure).
// On a successful swap the guest calls syscall.Exec and this response is
// never sent — the connection resets instead.
message RestartAgentResponse {}

// ─────────────────────────────────────────────────────────────────────────────
// AgentService — nexus3.agent.v1 control-plane service
// ─────────────────────────────────────────────────────────────────────────────

// AgentService is the gRPC control-plane service exposed by the in-guest PID-1
// agent on a fixed vsock port.  All RPCs are unary request/response.
//
// Interactive stdio is NOT modelled here; it flows on a separate multiplexed,
// clawk-framed vsock data connection (handshake/data/winsize/exit frames,
// ticket 36).
service AgentService {
  // Exec starts a process (optionally with a PTY).
  // Returns once the process is running.  Interactive stdio flows on the
  // data-plane connection — this RPC does not stream keystrokes.
  rpc Exec(ExecRequest) returns (ExecResponse);

  // Signal delivers a POSIX signal to the process of a running session.
  rpc Signal(SignalRequest) returns (SignalResponse);

  // SessionStatus returns read-only status for a single session.
  rpc SessionStatus(SessionStatusRequest) returns (SessionStatusResponse);

  // ListSessions returns read-only status for all known sessions.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // Copy negotiates a file-transfer operation (split-plane, ticket 22).
  // Metadata travels on this control RPC; bytes flow on the data-plane
  // side-channel identified by the returned transfer_id.
  // The agent archives directories itself (no guest tar).
  rpc Copy(CopyRequest) returns (CopyResponse);

  // AgentInfo returns the agent's build tag for version comparison.
  rpc AgentInfo(AgentInfoRequest) returns (AgentInfoResponse);

  // RestartAgent initiates a hot-swap of the in-guest binary via
  // syscall.Exec.  See RestartAgentRequest for the full protocol.
  // The RPC may not return a response — a connection reset means the swap
  // was initiated; the host should poll Ping then AgentInfo to confirm.
  rpc RestartAgent(RestartAgentRequest) returns (RestartAgentResponse);
}
