name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: go build ./...

      # TMPDIR=/tmp is required: long TMPDIR paths exceed the 107-byte AF_UNIX
      # sun_path limit and break socket-based tests in this repo.
      # The `integration` build tag is NOT set, so KVM-gated tests are excluded.
      - name: Test
        run: TMPDIR=/tmp go test ./...

      - name: Validate CLI examples in docs
        run: python3 scripts/docs/validate-cli-examples.py

      - name: Mutation-test the doc validator
        run: python3 scripts/docs/test-validate-cli-examples.py

      # Badge census: no page may lose a <Badge> without a same-commit baseline
      # update (--update-baseline).  Catches silent removal of danger/warning/tip/info
      # badges across all doc pages.  Run --census-only to skip the expensive
      # single-badge-removal sweep (that sweep is an offline analysis tool).
      - name: Badge census
        run: python3 scripts/docs/badge-coverage.py --census-only

  # ── Docs build ────────────────────────────────────────────────────────────
  # Catches broken VitePress docs early (bad imports, missing pages, etc.).
  # Runs in parallel with the main ci job; cannot break it.
  docs-build:
    name: Docs build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pin pnpm: "latest" floated to pnpm 11.x, which requires Node >=22.13
          # AND fails install with ERR_PNPM_IGNORED_BUILDS (esbuild build script).
          # pnpm 10.x installs the frozen lockfile and builds the docs cleanly.
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: docs/site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm build

  # ── Example: nexus3-in-docker build smoke ─────────────────────────────────
  # Verifies that the CI-feasible Dockerfile stages still build correctly.
  # The full image cannot be built in CI because the virtiofsd-stage COPY
  # requires a host-staged binary absent on ubuntu-latest (virtiofsd has no
  # pre-built GitLab binary releases).  Full boot is covered separately by the
  # KVM-gated Go test (internal/test/selfhost/docker_host_image_test.go, build
  # tag: integration) which runs only on dev/KVM machines.
  example-image-smoke:
    name: Example image smoke (nexus3-in-docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke — go-builder stage (proves nexus3 binary compiles)
        run: |
          docker build \
            -f examples/nexus3-in-docker/Dockerfile \
            --target go-builder \
            -t n3-smoke-go \
            .

      - name: Smoke — downloader stage (proves CH download URL + SHA-256 pin)
        run: |
          docker build \
            -f examples/nexus3-in-docker/Dockerfile \
            --target downloader \
            -t n3-smoke-dl \
            .
